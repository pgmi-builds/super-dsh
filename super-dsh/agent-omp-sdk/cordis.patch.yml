# @pgmi-builds/agent-omp-sdk bundle patch. This file is the `dsh.bundle.patch`
# layer of the published npm package: when this bundle is composed, the profile
# boot merges THIS patch — mount the OMP (SDK) provider plus disable the native
# components OMP replaces — exactly like a manual cordis.patch.yml.
#
# OPT-IN row (2026-10-03 user ruling): the super-dsh composite mounts this id
# with `disabled: true`. The RPC line (@pgmi-builds/agent-omp) is the PRIMARY
# path — it drives the operator's own `omp` binary over `--mode rpc`, so the
# plugin bundles no runtime. Turning this row on (plugin manager
# `setPluginEnabled`, or `dsh plugin`) IS the switch: presence of the row IS
# roster membership, and there is no env var / config key to keep in sync.
#
# Nothing is installed and nothing is fetched while the row is off: this package
# declares NO coding-agent/bun dependency and ships NO postinstall. The durable
# runtime (bun + the pinned @oh-my-pi/pi-coding-agent + this package's sidecar)
# is fetched into `<dshHome>/agents/omp-sdk/sdk-runtime/` on the FIRST real
# prompt of an `omp-sdk` session (src/sdk-runtime.ts; pre-warm with
# `npm run fetch-sdk-runtime`). Zero-spawn window before that prompt: no child,
# no download, no session event.
#
# Profile-specific values are deliberately NOT here: `webserver.port` (port
# choice) and `settings.path` (settings-under-profile) belong to the user's
# profile patch layer; `agent-default-model` is tracked dynamically from OMP's
# config.yml (`modelRoles.default`).

# Mount the OMP (SDK) provider: the same Cordis AgentFactory as the RPC line,
# driven through the SDK transport (one bun sidecar, N sessions, shared
# authStorage/modelRegistry). The provider instance is this package's own
# (`@pgmi-builds/agent-omp-sdk`): the two OMP lines are complete standalone
# copies, each shipping its own provider.
- insert:
    - id: omp-sdk-provider
      name: '@pgmi-builds/agent-omp-sdk'

# OMP owns the live agent transcript; disable the built-in loop so it does not
# double-run alongside the OMP sidecar.
- id: agent-loop
  disabled: true

# The native routes register deepseek-official / pi-ai providers; the OMP
# provider registers its own adapter (one route per OMP provider) on ctx.llm.
# Leaving them mounted would advertise native models alongside OMP's.
- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  disabled: true

# OMP is single-mode: its own runtime drives tools, so no Dash preset
# composition is needed. 0.1.7: the host AgentPresetRegistry row (renamed
# `agent-presets` → `agent-preset-registry`) stays MOUNTED — the bridge
# registers its one fixed preset into it (src/agent-preset-omp.ts, id `omp`:
# the capability IS OMP; the WORLD key is what differs) and the registry owns
# roster/selection/document RPC + the agentPreset projection.
# Pin only the default; modeSelectionEnabled already defaults to true.
- id: agent-preset-registry
  config:
    default: omp

# Titles come from OMP, not from Dash. The stock `session-title-first-prompt-llm`
# row would run a Dash-side LLM call (through whatever adapter serves ctx.llm)
# after the first prompt — that is Dash inventing functionality OMP does not
# have. OMP's own session file carries a `title` entry exposed through the
# sidecar; the transport is the only place that may mirror it into a
# `session/title` event.
- id: session-title-llm
  disabled: true

# dsh-shape-session-log: the native jsonl backend is the ONLY sessionPersistence.
# This adapter feeds it (producer role); native components serve list/page/replay.
# The plugin provides no persistence of its own — keep the stock row mounted.
#
# Directory picker: the stock `directory-picker-auto` is never a simple alias —
# it RESOLVES the interaction once per boot and mounts BOTH faces through the
# loader: the host backend package AND the matching CLIENT SURFACE package
# (`dsh-client-ui-directory-picker-<kind>`). The client surface is what
# occupies the workspace picker's directory-flow hole; with the hole empty the
# client hides the "add workspace" entry entirely (WorkspacePicker:
# `flowAvailable ? [ADD_WORKSPACE] : []`). NEVER just `disabled: true` this
# row — that removed the button. Pin the in-app browser by mounting both faces
# of `browse` ourselves (backend first: the surface's browser half drives the
# capability the backend registers) and unmounting the auto row.
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: directory-picker-browse-surface
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
- id: directory-picker
  disabled: true

# OMP has no runtime approval control — the transport maps the preset onto omp's
# launch-only `--approval-mode` flag, resolved AT SPAWN on both OMP lines from
# the session's own last `permission/preset`. Default to danger-full-access
# (OMP's own native yolo default). Restate the full 3-preset table: a patch with
# only defaultPreset silently drops the bundle's 3-preset table to the plugin's
# built-in 2, breaking the 3:3 Dash<->OMP pairing.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
